[package]
name = "regex-sweep"
version = "0.1.0"
description = "A desktop regex sweeper that exports matches to JSON"
authors = ["IanBedard"]
edition = "2021"

[lib]
name = "regex_sweep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
globset = "0.4"
ignore = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
